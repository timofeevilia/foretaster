name: Deploy site

# Builds the static site, checks it in a real browser, and publishes the result on the
# site-dist branch. The web host accepts no inbound connections, so it downloads that
# branch itself with site/deploy/pull.sh; this workflow holds no credentials for the host.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "examples/**"
      - "benchmark/results/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: uv sync --locked --all-extras
      - run: uv run python site/build.py
      - run: npm ci
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: node site/smoke.mjs
      - name: Package the site with a version marker and checksums
        run: sh site/deploy/package.sh site/dist "$RUNNER_TEMP/publish" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/publish
          include-hidden-files: true
          retention-days: 7

  # The only job with write access. It runs no code from the repository or from a
  # package registry: it takes the tested files from the build job and pushes them.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: publish
      - name: Push to the site-dist branch
        working-directory: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f site/index.html
          test -f site/.htaccess
          test "$(cat VERSION)" = "$GITHUB_SHA"
          (cd site && sha256sum --check --quiet ../SHA256SUMS)
          # The branch holds one commit and is replaced on every build, so the
          # repository does not grow by the size of the site each time.
          git init --quiet --initial-branch site-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Site built from $GITHUB_SHA"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-dist
