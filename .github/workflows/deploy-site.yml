name: Deploy site

# Builds the static site, checks it in a real browser, and copies it to the web host
# over SSH. Runs only for the main branch, so pull requests never see the secrets.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "examples/**"
      - "benchmark/results/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: uv sync --locked --all-extras
      - run: uv run python site/build.py
      - run: npm ci
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: node site/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Copy to the web host
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] \
             || [ -z "$SSH_KNOWN_HOSTS" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::notice::Deploy secrets are not set; the site was built and tested but not copied."
            exit 0
          fi
          # rsync --delete removes everything else in the target, so refuse any path
          # that is not plainly this site's own directory.
          case "$DEPLOY_PATH" in
            *foretaster*) ;;
            *) echo "::error::DEPLOY_PATH must contain 'foretaster'"; exit 1 ;;
          esac
          test -f dist/index.html
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync --archive --compress --delete \
            --rsh "ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          rm -f ~/.ssh/deploy_key
