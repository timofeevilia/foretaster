[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "foretaster"
version = "0.1.0"
description = "Security scanner for AI agent configurations and MCP servers: finds poisoned tools before your agent swallows them."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ilia Timofeev" }]
keywords = ["mcp", "ai-security", "llm-security", "agent-security", "tool-poisoning", "prompt-injection", "scanner"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/timofeevilia/foretaster"
Issues = "https://github.com/timofeevilia/foretaster/issues"

[project.scripts]
foretaster = "foretaster.cli:app"

[project.optional-dependencies]
connect = [
    "mcp>=2,<3",
]
llm = [
    "anthropic>=1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foretaster"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "SIM", # simplify
    "RUF",
    "PT",  # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=foretaster --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["foretaster"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
